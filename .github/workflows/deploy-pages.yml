name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # A Pages deployment replaces the whole artifact. Rehydrate the current ranking snapshot so
      # an ordinary code push cannot erase the data published by the scheduled workflow.
      - name: Download published rankings
        run: yarn rankings:download
        env:
          RANKINGS_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Stage published rankings
        run: yarn rankings:publish --allow-empty

      - name: Build GitHub Pages site
        run: yarn build:pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RANKINGS_BASE_URL: /${{ github.event.repository.name }}
          VITE_STATIC_DEPLOYMENT: true
          VITE_ENABLE_CLOUD: false
          VITE_ENABLE_COLLAB: false
          VITE_ENABLE_ROUTE_SHARING: false
          VITE_ENABLE_ANALYTICS: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
